; D2RCameraTool settings
; Paths and numbers are locale-independent (always use '.' as the decimal separator).

sensitivity=0.5
zoom_hotkey=Z
pan_hotkey=Space
throttle=0.01

; ---- WASD camera control -------------------------------------------------
; A/D swing the view direction (yaw), W looks toward the ground, S toward the sky.
; Movement is time-based: wasd_speed is radians per second.
wasd_enabled=1
wasd_speed=1.2

; Flip an axis if it feels backwards in game.
wasd_invert_yaw=0
wasd_invert_pitch=0

; Swallow W/A/S/D before the game sees them (only while the game is focused),
; so the game does not also act on them.
wasd_block_keys=1

; Only move the camera while the game owns the foreground window.
wasd_require_focus=1

; How often the camera value is written, in milliseconds (1-100).
; Smoother is FASTER here, which is not the usual intuition: each write advances the camera
; by speed * interval, so a shorter interval means a smaller step. Measured in game, 1 is the
; smoothest and 16 visibly judders. The engine does NOT overwrite the value between writes
; (verified: the engineRewrites counter stays at 0), so this is about step size, not about
; winning a race.
wasd_update_ms=1

; ---- Heading hunt (follow-camera investigation) --------------------------
; Press this key to capture a labelled snapshot of memory around the camera. It is a global
; hotkey so it works while the game has focus - clicking the tool instead would take focus
; away, and losing focus is known to change game state.
;
; Procedure: walk one way, stop, press it; walk the opposite way, stop, press it again. The
; character's heading differs by about pi between the two poses, and the tool reports any
; value whose angular change is near pi. Those are the heading candidates.
sample_hotkey=F9

; Bytes examined either side of the camera base (default 0x4000 = 16 KB each way).
sample_window=16384

; Also append the raw window to camera_samples.txt. Off makes the log smaller but leaves
; nothing to re-analyse if the first pass finds nothing.
sample_raw_dump=1

; ---- Follow camera -------------------------------------------------------
; Keeps the camera behind the character. In Diablo the character always faces the direction it
; walks, so the movement direction IS the facing: this tracks the world position and turns the
; camera to match. There is no stored heading involved.
;
; yaw = (+/- movement direction) + follow_offset. The sign and the offset are the only two things
; that need tuning, and both are on the panel so they can be adjusted while playing.
;
; The values below were found on the live game: with Invert on and offset 1.9 the camera settles
; behind the character, so the character walks away from the viewer. Roll is held at zero while
; following - the isometric view's deliberate 5.7 degree tilt reads as the ground leaning once the
; camera is behind the character.
follow_enabled=1
follow_invert=1
follow_offset=1.9

preset1=0.5,-0.892399,0.369644,0.099046,0.239118,0
preset2=0.5,-0.892399,0.369644,0.099046,0.239118,0
preset3=0.5,-0.892399,0.369644,0.099046,0.239118,0
preset4=0.5,-0.892399,0.369644,0.099046,0.239118,0
preset5=0.5,-0.892399,0.369644,0.099046,0.239118,0
